name: Deploy API (Cloudflare Worker + D1)

# Runs on every push that touches backend/, or by hand from the Actions tab.
# Needs one repository secret: CLOUDFLARE_API_TOKEN
# (and CLOUDFLARE_ACCOUNT_ID only if that token can see more than one account).
on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: write # to record the API address in lib/api-endpoint.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install --quiet "pytest>=8"
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply khujirt-db --remote

      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev address in the deploy output. Open Workers & Pages in the Cloudflare dashboard once so the account gets its workers.dev subdomain, then re-run."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set IP_HASH_SALT once
        run: |
          if npx wrangler secret list 2>/dev/null | grep -q '"IP_HASH_SALT"'; then
            echo "IP_HASH_SALT already set"
          else
            openssl rand -hex 32 | npx wrangler secret put IP_HASH_SALT
          fi

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/api/products?lang=mn" | grep -q '"khujirt"'; then
              echo "API answers with the products from D1"; exit 0
            fi
            sleep 5
          done
          echo "::error::The API did not answer"; exit 1

      - name: Record the API address for the site
        working-directory: .
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '{\n  "url": "%s"\n}\n' "$URL" > lib/api-endpoint.json
          if git diff --quiet -- lib/api-endpoint.json; then
            echo "Site already points at $URL"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/api-endpoint.json
            git commit -m "Point the site at the deployed API ($URL)"
            git push
          fi
